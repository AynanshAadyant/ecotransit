[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecotransit"
version = "1.0.0"
description = "EcoTransit Python Data Ingestion & Machine Learning Intelligence Services"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Aynansh Aadyant" },
    { name = "Krishna Kumar" },
    { name = "Sumit Kumar" },
]

dependencies = [
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "redis[hiredis]>=5.0.8",
    "asyncpg>=0.29.0",
    "aiomqtt>=2.2.0",
    "gtfs-realtime-bindings>=1.0.0",
    "protobuf>=5.27.0",
    "httpx>=0.27.0",
    "scikit-learn>=1.5.1",
    "pandas>=2.2.2",
    "numpy>=2.0.0",
    "prometheus-client>=0.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
    "ruff>=0.6.2",
    "mypy>=1.11.1",
    "types-protobuf>=5.27.0"
]

[tool.hatch.build.targets.wheel]
packages = [
    "shared/python/ecotransit_shared",
    "services/python/ingestion-worker",
    "services/python/intelligence-job"
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM"  # flake8-simplify
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ecotransit_shared"]

[tool.pyright]
include = ["shared/python", "services/python"]
extraPaths = [
    "shared/python",
    "services/python/ingestion-worker"
]

[tool.mypy]
python_version = "3.11"
mypy_path = "shared/python;services/python/ingestion-worker"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "gtfs_realtime_bindings.*",
    "google.transit.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
pythonpath = [
    "shared/python",
    "services/python/ingestion-worker"
]
norecursedirs = [
    "node_modules",
    "dist",
    ".git",
    "infra",
    "otd_data"
]
testpaths = [
    "services/python/ingestion-worker/tests",
    "test"
]